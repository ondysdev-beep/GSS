[package]
name = "gss"
version = "3.6.0"
description = "GSS — Game Systems Simulator"
authors = ["neopryus"]
edition = "2021"

[lib]
name = "gss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri CLI odmítne build, pokud se major.minor Rust crate liší od JS balíčku
# (@tauri-apps/api, @tauri-apps/plugin-* v package.json). Při upgradu zvedni
# obě strany najednou.
tauri = { version = "~2.10", features = [] }
tauri-plugin-dialog = "~2.6"
tauri-plugin-store = "~2.4"
tauri-plugin-updater = "~2.10"
tauri-plugin-process = "~2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
pro = []
