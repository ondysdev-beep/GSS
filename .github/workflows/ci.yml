name: CI / Release

# Single source of truth for validation and release builds.
# Replaces the previous build.yml / build-linux.yml / build-windows.yml /
# release.yml, which overlapped and could trigger concurrently on the same
# tag with no shared test gate (see audit R-07).
#
# - Every push/PR to main/master: run "validate" (version check, typecheck,
#   lint, tests); pushes to main/master also deploy the web version.
# - Pushing a `v*` tag: run "validate" first, then build + publish a draft
#   GitHub Release only if validate passed, then generate the per-edition
#   updater manifests. This is the only workflow that creates releases, so
#   there is no risk of duplicate/competing releases.

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Version consistency (package.json / tauri.conf.json / Cargo.toml / version.json)
        run: npm run check:version
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: TypeScript check (sdk/)
        run: npm run typecheck:sdk
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:run

  build:
    name: Build (${{ matrix.platform }} / ${{ matrix.edition }})
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        # PRO builds override productName to "GSS-PRO" so the installer
        # filename differs from the FREE build. PRO is sold on itch.io, so its
        # installers are NOT attached to the public GitHub Release (see the
        # "PRO:" steps). PRO updates come from itch.io, not the Tauri updater:
        # no updater bundles are built, and the endpoint override only makes
        # sure a PRO install can never "update" itself to the FREE build.
        include:
          - platform: windows-latest
            edition: FREE
            args: ''
          - platform: windows-latest
            edition: PRO
            args: '--features pro --config {"productName":"GSS-PRO","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://github.com/ondysdev-beep/GSS/releases/latest/download/latest-pro.json"]}}}'
          - platform: ubuntu-22.04
            edition: FREE
            args: ''
          - platform: ubuntu-22.04
            edition: PRO
            args: '--features pro --config {"productName":"GSS-PRO","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://github.com/ondysdev-beep/GSS/releases/latest/download/latest-pro.json"]}}}'
          # One universal build (Apple Silicon + Intel in one .dmg) instead of
          # two per-architecture builds: itch.io's mac-free channel holds one
          # set of files, and users no longer have to pick an architecture.
          - platform: macos-latest
            edition: FREE
            args: '--target universal-apple-darwin'
          # NOTE: macOS PRO builds are not currently produced (this matches
          # the scope of the previous release.yml, which never built PRO for
          # macOS either — not a regression from this consolidation, but a
          # known gap worth revisiting separately).

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # job-index keeps cache keys unique per matrix entry
          key: ${{ matrix.platform }}-${{ matrix.edition }}-${{ strategy.job-index }}

      # Icons are committed in src-tauri/icons (generated from app-icon-source.png
      # via `npm run icons`). The old "node generate-icons.cjs" step overwrote
      # them with flat grey placeholder squares in every release build.
      - run: npm ci

      # The Rust cache can restore installers from an earlier run; start clean
      # so only this build's files get uploaded.
      - name: Remove cached installers
        shell: bash
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle

      - name: Build and publish draft release (FREE)
        if: matrix.edition == 'FREE'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-updater signing (see SECURITY.md "Auto-update signing key").
          # tauri-action detects these and signs each updater bundle
          # (createUpdaterArtifacts in tauri.conf.json). The manifest
          # latest-free.json is generated by the `updater-manifests` job
          # below (tauri-action's own latest.json is disabled; PRO is not on
          # this release and updates through itch.io).
          # No password was set on the key (see SECURITY.md for why that's
          # the correct choice for CI-only signing) — the third var is kept
          # empty on purpose, not omitted, so a future password-protected
          # key swap doesn't silently do nothing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GSS ${{ github.ref_name }}'
          releaseBody: |
            GSS FREE: download the installer for your platform:
            - **Windows**: `.msi` (recommended) or `.exe` (NSIS)
            - **macOS**: `.dmg` (universal: Apple Silicon and Intel)
            - **Linux**: `.deb` or `.AppImage`

            **GSS PRO** (exports, AutoTuner, Monte Carlo, Parameter Sweep) is
            available on itch.io: https://neopryus.itch.io/idle-economy-simulator
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      # ── PRO: built here, but never attached to the public GitHub Release ──
      - name: Build (PRO, no release upload)
        if: matrix.edition == 'PRO'
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      # ── itch.io: FREE → windows-free / mac-free / linux-free,
      #             PRO  → windows-pro / linux-pro ──
      # Only this version's installers: the Rust cache may keep bundles of
      # older versions in target/.
      - name: Collect installers for itch.io
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p itch-out
          find src-tauri/target \( -path '*/bundle/nsis/*' -o -path '*/bundle/appimage/*' -o -path '*/bundle/dmg/*' \) \
            \( -name "*_${VER}_*-setup.exe" -o -name "*_${VER}_*.AppImage" -o -name "*_${VER}_*.dmg" \) \
            -exec cp {} itch-out/ \;
          ls -la itch-out
          [ -n "$(ls -A itch-out)" ] || { echo "No installers for version $VER found"; exit 1; }

      # Automatic upload to itch.io (butler) when the BUTLER_API_KEY secret is
      # set (itch.io → Settings → API keys). Target page = repository variable
      # ITCH_GAME (default neopryus/idle-economy-simulator). itch.io detects
      # the platform from the channel name.
      - name: Is itch.io upload configured?
        id: itch
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -n "$BUTLER_API_KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Upload to itch.io (butler)
        if: steps.itch.outputs.enabled == 'true'
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME || 'neopryus/idle-economy-simulator' }}
          EDITION: ${{ matrix.edition }}
        run: |
          # Accepts "user/game" as well as a page URL ("https://user.itch.io/game").
          GAME=$(printf '%s' "$ITCH_GAME" | sed -E 's#^https?://##; s#^([^./]+)\.itch\.io/#\1/#; s#/+$##')
          case "$GAME" in */*) ;; *) echo "ITCH_GAME must look like user/game, got: $ITCH_GAME"; exit 1 ;; esac
          case "$RUNNER_OS" in
            Windows) CHANNEL=windows; BUTLER=windows-amd64 ;;
            macOS)   CHANNEL=mac;     BUTLER=darwin-$([ "$(uname -m)" = arm64 ] && echo arm64 || echo amd64) ;;
            *)       CHANNEL=linux;   BUTLER=linux-amd64 ;;
          esac
          if [ "$EDITION" = "PRO" ]; then CHANNEL="$CHANNEL-pro"; else CHANNEL="$CHANNEL-free"; fi
          curl -sSfL -o butler.zip "https://broth.itch.zone/butler/$BUTLER/LATEST/archive/default"
          unzip -q butler.zip -d butler-bin
          chmod +x butler-bin/butler* || true
          ./butler-bin/butler push itch-out "$GAME:$CHANNEL" --userversion "${GITHUB_REF_NAME#v}"

      # PRO without BUTLER_API_KEY: the installers are kept for 1 day as a
      # workflow artifact (Actions → this run → Artifacts) for a manual upload.
      # (FREE installers are on the GitHub Release anyway.)
      - name: 'PRO: keep installers as a short-lived artifact'
        if: matrix.edition == 'PRO' && steps.itch.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GSS-PRO-${{ runner.os }}
          path: itch-out
          retention-days: 1
          if-no-files-found: error

  updater-manifests:
    name: Updater manifest (latest-free.json)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate and upload manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-updater-manifests.cjs "${{ github.ref_name }}"

  deploy-web:
    name: Deploy web version (Cloudflare Pages)
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Jen FREE: PRO se prodává na itch.io a statická podsložka /pro/ by
      # byla zdarma dostupná komukoli, kdo zná adresu.
      - name: Build web (FREE)
        run: npm run build:web:free

      # Vyžaduje 2 GitHub Secrets a 1 proměnnou (Settings → Secrets and
      # variables → Actions):
      #   CLOUDFLARE_API_TOKEN  — Cloudflare → My Profile → API Tokens →
      #                            custom token "Account / Cloudflare Pages / Edit"
      #   CLOUDFLARE_ACCOUNT_ID — kód v URL dashboardu (dash.cloudflare.com/<id>)
      #   CLOUDFLARE_PAGES_ENABLED = true (záložka Variables)
      # Projekt gss-web se založí sám při prvním nasazení (v dashboardu ho přes
      # Direct Upload nejde založit bez nahrání souborů). cloudflare/pages-action
      # byl z GitHubu odstraněn, proto se volá přímo wrangler.
      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CLOUDFLARE_PAGES_ENABLED == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create gss-web --production-branch=main \
            || echo "Project gss-web already exists (or could not be created; the deploy below reports why)."
          npx --yes wrangler@4 pages deploy dist-web/free --project-name=gss-web --branch=main
